# Needed until https://github.com/dependabot/dependabot-core/issues/15551 gets fixed
name: Dependabot uv.lock upgrade

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - 'misc/codegen/**'
      - 'misc/qt-updater/**'

jobs:
  uv-lock-upgrade:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/uv/') }}
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Run uv lock --upgrade
        id: upgrade
        run: |
          for dir in misc/codegen misc/qt-updater; do
            if git diff --name-only HEAD~1 | grep -q "^${dir}/"; then
              (cd "${dir}" && uv lock --upgrade)
              if ! git diff --exit-code "${dir}/uv.lock"; then
                echo "changed=${dir}/uv.lock" >> "${GITHUB_OUTPUT}"
              fi
            fi
          done

      - name: Commit and push changes
        run: |
          gh api graphql -f query='
            mutation($repo: String!, $branch: String!, $oid: GitObjectID!, $msg: String!, $files: [FileAddition!]!) {
              createCommitOnBranch(input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $oid,
                message: { headline: $msg },
                fileChanges: { additions: $files }
              }) { commit { url } }
            }' \
            -f repo="${{ github.repository }}" \
            -f branch="${HEAD_REF}" \
            -f oid="${{ github.event.pull_request.head.sha }}" \
            -f msg="chore(deps): update indirect dependencies" \
            -f files[][path]="${{ steps.upgrade.outputs.changed }}" \
            -f files[][contents]=$(base64 -w 0 ${{ steps.upgrade.outputs.changed }})

        env:
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.upgrade.outputs.changed != ''
