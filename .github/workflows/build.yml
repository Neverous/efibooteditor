name: Build EFIBootEditor

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      compiler:
        required: true
        type: string
      build-config:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  BUILD_CONFIG: ${{ inputs.build-config }}
  BUILD_OS: ${{ inputs.os }}
  BUILD_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: ${{ inputs.os }} Qt ${{ matrix.qt-version }} with ${{ inputs.compiler }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        qt-version:
          - 5.15.2 # Supported in Ubuntu Resolute Raccoon until 2031-04-30
          - 6.2.4  # Supported in Ubuntu Jammy Jellyfish until 2027-04-01
          - 6.11.2 # Supported until 2026-09-22
        exclude:
          - qt-version: ${{ endsWith(inputs.os, 'arm') && '5.15.2' || 'none' }}
          - qt-version: ${{ endsWith(inputs.os, 'arm') && '6.2.4' || 'none' }}
          - qt-version: ${{ inputs.os == 'macos-26' && '6.2.4' || 'none' }}
          - qt-version: ${{ inputs.os == 'xcode-27' && '6.2.4' || 'none' }}
          - qt-version: ${{ inputs.os == 'windows-2025' && '5.15.2' || 'none' }} # stdext: undeclared identifier - removed in vs2026
          - qt-version: ${{ inputs.os == 'windows-2025' && '6.2.4' || 'none' }} # stdext: undeclared identifier - removed in vs2026
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03
        with:
          key: ${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.build-config }}-${{ matrix.qt-version }}
          restore-keys: |
            ${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.build-config }}
            ${{ inputs.os }}-${{ inputs.compiler }}
            ${{ inputs.os }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: cpp
          queries: security-and-quality
        if: inputs.build-config == 'Debug'
        continue-on-error: true

      - name: Install python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Set up Qt environment
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          cache: false
          version: ${{ matrix.qt-version }}
          setup-python: false
          # https://github.com/miurahr/aqtinstall/pull/1000
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

      - name: Install CMake
        run: |
          curl https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /etc/apt/trusted.gpg.d/kitware.gpg >/dev/null
          sudo apt-add-repository "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main"
          sudo apt-get update
          sudo apt-get install cmake
          mv /usr/local/bin/cmake /usr/local/bin/cmake3
          mv /usr/local/bin/cpack /usr/local/bin/cpack3

          cmake --version
        shell: bash
        if: startsWith(inputs.os, 'ubuntu')

      - name: Install libfuse2
        run: sudo apt-get install libfuse2
        shell: bash
        if: startsWith(inputs.os, 'ubuntu')

      - name: Install linuxdeploy
        run: |
          DIR=$(mktemp -d)
          echo "${DIR}" >> ${GITHUB_PATH}
          curl --proto '=https' -sS -L -C - https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage -o ${DIR}/linuxdeploy
          curl --proto '=https' -sS -L -C - https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${ARCH}.AppImage -o ${DIR}/linuxdeploy-plugin-qt
          curl --proto '=https' -sS -L -C - https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage -o ${DIR}/appimagetool
          chmod +x ${DIR}/*
        shell: bash
        if: startsWith(inputs.os, 'ubuntu')
        env:
          ARCH: ${{ endsWith(inputs.os, 'arm') && 'aarch64' || 'x86_64' }}

      - name: Install efivar
        run: sudo apt-get install libefiboot1 libefiboot-dev libefivar-dev
        shell: bash
        if: startsWith(inputs.os, 'ubuntu')

      - name: Install libxkbcommon-x11-0 and libxcb-cursor0 and zlib1g-dev
        run: sudo apt-get install libxkbcommon-x11-0 libxcb-cursor0 zlib1g-dev
        shell: bash
        if: startsWith(inputs.os, 'ubuntu')

      - name: Install imagemagick
        run: sudo apt-get install imagemagick
        shell: bash
        if: startsWith(inputs.os, 'ubuntu')

      - name: Install imagemagick
        run: arch -arm64 brew install imagemagick
        shell: bash
        if: ${{ startsWith(inputs.os, 'macos') || startsWith(inputs.os, 'xcode') }}

      - name: Install imagemagick
        run: |
          choco install imagemagick --force --no-progress

          $MagickPath = (Get-ChildItem "C:\Program Files*\ImageMagick*")[0].FullName
          "MAGICK_HOME=$MagickPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MAGICK_CONFIGURE_PATH=$MagickPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MAGICK_CODER_MODULE_PATH=$MagickPath\modules\coders" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if: startsWith(inputs.os, 'windows')

      - name: Install WiX Toolset v4+
        run: |
          dotnet tool install --global wix
          wix eula accept wix7
          wix extension add --global WixToolset.UI.wixext
        if: startsWith(inputs.os, 'windows')

      - name: Configure with ${{ inputs.compiler }}
        run: |
          cmake --preset ${BUILD_CONFIG} -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER=${{ inputs.compiler == 'Clang' && 'clang' || 'gcc' }} -DCMAKE_CXX_COMPILER=${{ inputs.compiler == 'Clang' && 'clang++' || 'g++' }} ${{ (startsWith(inputs.os, 'macos') || startsWith(inputs.os, 'xcode')) && startsWith(matrix.qt-version, '5') && '-DCMAKE_OSX_ARCHITECTURES="x86_64"' || '' }} -G Ninja
        shell: bash
        if: ${{ !startsWith(inputs.os, 'windows') }}

      - name: Build
        run: cmake --build --preset ${BUILD_CONFIG}
        shell: bash
        if: ${{ !startsWith(inputs.os, 'windows') }}

      - name: Configure and build with ${{ inputs.compiler }}
        run: |
          call "%programfiles%\Microsoft Visual Studio\${{ (startsWith(inputs.os, 'windows-2025') || inputs.os == 'windows-11-vs2026-arm') && '18' || '2022' }}\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ endsWith(inputs.os, 'arm') && 'arm64' || 'x64' }} || exit /b
          cmake --preset %BUILD_CONFIG% -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake -DCMAKE_VERBOSE_MAKEFILE=ON ${{ inputs.compiler == 'Clang' && '-DCMAKE_C_COMPILER=clang-cl.exe -DCMAKE_CXX_COMPILER=clang-cl.exe' || '' }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -G Ninja || exit /b
          cmake --build --preset %BUILD_CONFIG%
        shell: cmd
        if: startsWith(inputs.os, 'windows')

      - name: Run tests
        id: test
        continue-on-error: true
        run: ctest --preset ${BUILD_CONFIG} -VV
        shell: bash
        env:
          FONTCONFIG_PATH: /etc/fonts
          QT_FONT_DPI: 96
          QT_LOGGING_RULES: '*.debug=false'
          QT_QPA_PLATFORM: offscreen
          TEST_ALLOW_NO_EFI_ENTRIES: ${{ (startsWith(inputs.os, 'macos') || startsWith(inputs.os, 'xcode')) && 'true' || '' }}

      - name: Check visuals
        id: visual
        continue-on-error: true
        run: |
          if command -v magick >/dev/null 2>&1; then
            CMP="magick compare"
          else
            CMP="compare"
          fi

          mv build/${BUILD_CONFIG}/tests/screenshot.png ${ARTIFACT_VERSION}-ci.png
          ${CMP} -metric RMSE ${ARTIFACT_VERSION}-ci.png tests/screenshots/${ARTIFACT_VERSION}.png ${ARTIFACT_VERSION}-diff.png || true
          DIFF=$(${CMP} -metric RMSE ${ARTIFACT_VERSION}-ci.png tests/screenshots/${ARTIFACT_VERSION}.png ${ARTIFACT_VERSION}-diff.png 2>&1 | awk -F'[()]' '{print ($2 > 0.02)}' || true)
          [ "${DIFF}" = "0" ] || exit 255
        shell: bash
        env:
          ARTIFACT_VERSION: ${{ inputs.os }}-qt-${{ matrix.qt-version }}

      - name: Upload visual diff
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-diff-${{ inputs.os }}-qt-${{ matrix.qt-version }}-${{ inputs.compiler }}
          path: |
            ${{ inputs.os }}-qt-${{ matrix.qt-version }}-ci.png
            ${{ inputs.os }}-qt-${{ matrix.qt-version }}-diff.png
          retention-days: 5

      - name: Package
        run: |
          for t in $(seq 1 20); do # FIXME: macOS has random hdiutil errors because of some protection mechanisms, just retry few times https://github.com/actions/runner-images/issues/7522#issuecomment-1556766641
            cmake --build --preset ${BUILD_CONFIG} --target package && exit 0
            rm -rf build/${BUILD_CONFIG}/dist/
          done
          exit 255
        shell: bash

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          output-file: build/${{ inputs.build-config }}/dist/EFIBootEditor-${{ github.sha }}-${{ inputs.os }}-qt-${{ matrix.qt-version }}.spdx
          upload-artifact: false
          upload-release-assets: false

      - name: Attest artifacts
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: build/${{ inputs.build-config }}/dist/EFIBootEditor-*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: EFIBootEditor-${{ github.sha }}-${{ inputs.os }}-qt-${{ matrix.qt-version }}-${{ inputs.compiler }}
          if-no-files-found: error
          path: build/${{ inputs.build-config }}/dist/EFIBootEditor-*

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        if: inputs.build-config == 'Debug'
        continue-on-error: true

      - name: Check final status
        if: ${{ always() && (steps.visual.outcome == 'failure' || steps.test.outcome == 'failure') }}
        run: |
          echo "::error::Pipeline failed!"
          if [ "${{ steps.visual.outcome }}" = "failure" ]; then
            echo "FAILED: Visuals check failed."
          fi
          if [ "${{ steps.test.outcome }}" = "failure" ]; then
            echo "FAILED: Tests failed."
          fi
          exit 255
